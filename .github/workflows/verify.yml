name: Verify dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -B -m pytest -q -p no:cacheprovider tests
      - run: docker build -t dashboard-verification ./backend
      - run: python -B tests/container_smoke.py --image dashboard-verification

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chrome
      - name: Browser checks with synthetic data only
        shell: bash
        run: |
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/dashboard-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          for test in smoke cargo voyages availability drilldown management navigation refresh_download targets governance; do
            python -B "tests/browser_${test}.py" --url http://127.0.0.1:5173
          done
